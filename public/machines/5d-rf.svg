<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="50%" stop-color="#F7F3EB"/>
      <stop offset="100%" stop-color="#EFE9DD"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#1C1917" flood-opacity="0.10"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Clean Studio Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="24"/>

  <!-- Subtle Studio Floor Reflection Oval -->
  <ellipse cx="400" cy="520" rx="260" ry="24" fill="#000000" fill-opacity="0.06"/>
  <ellipse cx="400" cy="516" rx="190" ry="14" fill="#000000" fill-opacity="0.08"/>

  <!-- Machine Hardware Art -->
  <g filter="url(#dropShadow)">
    
  <!-- Slim Medical RF Tower -->
  <rect x="320" y="160" width="160" height="325" rx="24" fill="url(#bodyGrad)" stroke="#CBD5E1" stroke-width="3"/>
  <rect x="335" y="180" width="130" height="95" rx="10" fill="url(#screenGrad)"/>
  <!-- UI Screen -->
  <rect x="343" y="188" width="114" height="79" rx="6" fill="#D97706" fill-opacity="0.15"/>
  <circle cx="400" cy="225" r="18" fill="none" stroke="#F59E0B" stroke-width="3"/>
  <text x="400" y="229" fill="#FEF3C7" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">5D RF CORE</text>
  <!-- Accent Trim Lines -->
  <path d="M330 300 L470 300" stroke="#D97706" stroke-width="3"/>
  <rect x="350" y="325" width="100" height="120" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="2"/>
  <!-- Probe Connectors -->
  <circle cx="375" cy="405" r="10" fill="url(#metalGrad)" stroke="#64748B" stroke-width="2"/>
  <circle cx="425" cy="405" r="10" fill="url(#metalGrad)" stroke="#64748B" stroke-width="2"/>
  <!-- Multi-Polar RF Handpieces -->
  <!-- Left Body RF Wand -->
  <path d="M260 220 Q290 320 340 405" stroke="#475569" stroke-width="5" fill="none"/>
  <rect x="230" y="170" width="38" height="120" rx="10" fill="url(#metalGrad)" stroke="#475569" stroke-width="2"/>
  <circle cx="240" cy="165" r="5" fill="#D97706"/>
  <circle cx="258" cy="165" r="5" fill="#D97706"/>
  <!-- Right Face RF Wand -->
  <path d="M540 220 Q510 320 460 405" stroke="#475569" stroke-width="5" fill="none"/>
  <rect x="532" y="175" width="34" height="110" rx="10" fill="url(#metalGrad)" stroke="#475569" stroke-width="2"/>
  <circle cx="549" cy="170" r="6" fill="#D97706"/>
  <!-- Base Stand &amp; Castors -->
  <rect x="295" y="480" width="210" height="24" rx="8" fill="url(#metalGrad)" stroke="#64748B" stroke-width="2"/>
  <circle cx="325" cy="510" r="8" fill="#334155"/><circle cx="475" cy="510" r="8" fill="#334155"/>

  </g>

  <!-- Clean Top-Right Badge -->
  <g transform="translate(620, 36)">
    <rect width="144" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.9" stroke="#E2E8F0" stroke-width="1"/>
    <text x="72" y="18" fill="#78350F" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5" text-anchor="middle">BEAUTECH AESTHETIC</text>
  </g>

  <!-- Clean Bottom Left Model Label -->
  <g transform="translate(36, 546)">
    <text x="0" y="0" fill="#1C1917" font-family="Georgia, serif" font-size="16" font-weight="600">5D RF</text>
    <text x="0" y="18" fill="#78716C" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">HIFU / LIFTING / SKIN TIGHTENING</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="50%" stop-color="#F7F3EB"/>
      <stop offset="100%" stop-color="#EFE9DD"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#1C1917" flood-opacity="0.10"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Clean Studio Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="24"/>

  <!-- Subtle Studio Floor Reflection Oval -->
  <ellipse cx="400" cy="520" rx="260" ry="24" fill="#000000" fill-opacity="0.06"/>
  <ellipse cx="400" cy="516" rx="190" ry="14" fill="#000000" fill-opacity="0.08"/>

  <!-- Machine Hardware Art -->
  <g filter="url(#dropShadow)">
    
  <!-- Main Chassis -->
  <rect x="310" y="180" width="180" height="300" rx="28" fill="url(#bodyGrad)" stroke="#CBD5E1" stroke-width="3"/>
  <rect x="330" y="205" width="140" height="110" rx="12" fill="url(#screenGrad)"/>
  <!-- UI Glow Screen -->
  <rect x="338" y="213" width="124" height="94" rx="8" fill="#0369A1" fill-opacity="0.2"/>
  <circle cx="400" cy="255" r="24" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="8 4"/>
  <text x="400" y="259" fill="#E0F2FE" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">HYDRO VORTEX</text>
  <!-- Solution Flasks -->
  <rect x="335" y="335" width="36" height="70" rx="8" fill="#E0F2FE" fill-opacity="0.85" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="382" y="335" width="36" height="70" rx="8" fill="#FEF08A" fill-opacity="0.85" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="429" y="335" width="36" height="70" rx="8" fill="#FCE7F3" fill-opacity="0.85" stroke="#94A3B8" stroke-width="1.5"/>
  <!-- Side Wands / Handpieces -->
  <!-- Left Handles -->
  <path d="M260 220 L310 240" stroke="#94A3B8" stroke-width="4" fill="none"/>
  <rect x="235" y="195" width="32" height="110" rx="8" fill="url(#metalGrad)" stroke="#64748B" stroke-width="2"/>
  <rect x="239" y="165" width="24" height="35" rx="6" fill="#38BDF8"/>
  <path d="M220 270 L310 280" stroke="#94A3B8" stroke-width="4" fill="none"/>
  <rect x="195" y="245" width="30" height="95" rx="8" fill="url(#metalGrad)" stroke="#64748B" stroke-width="2"/>
  <!-- Right Handles -->
  <path d="M540 220 L490 240" stroke="#94A3B8" stroke-width="4" fill="none"/>
  <rect x="535" y="195" width="32" height="110" rx="8" fill="url(#metalGrad)" stroke="#64748B" stroke-width="2"/>
  <!-- PDT Mask Arch Attachment -->
  <path d="M400 170 C400 90 560 90 580 170 C590 220 540 270 510 270" fill="none" stroke="#EF4444" stroke-width="6" stroke-linecap="round" filter="url(#softGlow)"/>
  <ellipse cx="565" cy="180" rx="42" ry="55" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
  <circle cx="550" cy="165" r="5" fill="#EF4444"/>
  <circle cx="580" cy="165" r="5" fill="#EF4444"/>
  <circle cx="565" cy="195" r="7" fill="#EF4444"/>
  <!-- Machine Base Wheels -->
  <rect x="290" y="475" width="220" height="24" rx="8" fill="url(#metalGrad)" stroke="#64748B" stroke-width="2"/>
  <circle cx="320" cy="505" r="10" fill="#334155"/>
  <circle cx="480" cy="505" r="10" fill="#334155"/>

  </g>

  <!-- Clean Top-Right Badge -->
  <g transform="translate(620, 36)">
    <rect width="144" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.9" stroke="#E2E8F0" stroke-width="1"/>
    <text x="72" y="18" fill="#78350F" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5" text-anchor="middle">BEAUTECH AESTHETIC</text>
  </g>

  <!-- Clean Bottom Left Model Label -->
  <g transform="translate(36, 546)">
    <text x="0" y="0" fill="#1C1917" font-family="Georgia, serif" font-size="16" font-weight="600">6 in 1 Hydrafacial with PDT</text>
    <text x="0" y="18" fill="#78716C" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">FACIAL &amp; SKIN CARE</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="50%" stop-color="#F7F3EB"/>
      <stop offset="100%" stop-color="#EFE9DD"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#1C1917" flood-opacity="0.10"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Clean Studio Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="24"/>

  <!-- Subtle Studio Floor Reflection Oval -->
  <ellipse cx="400" cy="520" rx="260" ry="24" fill="#000000" fill-opacity="0.06"/>
  <ellipse cx="400" cy="516" rx="190" ry="14" fill="#000000" fill-opacity="0.08"/>

  <!-- Machine Hardware Art -->
  <g filter="url(#dropShadow)">
    
  <!-- Desktop PDT Curved Tunnel Shell -->
  <path d="M220 440 L220 280 C220 150 580 150 580 280 L580 440 L530 440 L530 300 C530 200 270 200 270 300 L270 440 Z" fill="url(#bodyGrad)" stroke="#CBD5E1" stroke-width="4"/>
  <!-- Outer Modern Curved Canopy -->
  <path d="M200 450 L200 270 C200 120 600 120 600 270 L600 450" fill="none" stroke="#E2E8F0" stroke-width="12" stroke-linecap="round"/>
  <!-- Top Digital Control Keypad -->
  <rect x="350" y="130" width="100" height="40" rx="10" fill="url(#screenGrad)"/>
  <text x="400" y="155" fill="#38BDF8" font-size="12" font-family="monospace" font-weight="bold" text-anchor="middle">20:00</text>
  <!-- LED Array Inside Tunnel Matrix -->
  <g fill="#EF4444" filter="url(#softGlow)">
    <circle cx="250" cy="320" r="8"/><circle cx="280" cy="240" r="8"/><circle cx="340" cy="180" r="8"/>
    <circle cx="400" cy="170" r="8"/><circle cx="460" cy="180" r="8"/><circle cx="520" cy="240" r="8"/><circle cx="550" cy="320" r="8"/>
  </g>
  <g fill="#3B82F6" filter="url(#softGlow)">
    <circle cx="250" cy="370" r="7"/><circle cx="300" cy="260" r="7"/><circle cx="360" cy="200" r="7"/>
    <circle cx="440" cy="200" r="7"/><circle cx="500" cy="260" r="7"/><circle cx="550" cy="370" r="7"/>
  </g>
  <g fill="#22C55E" filter="url(#softGlow)">
    <circle cx="250" cy="410" r="6"/><circle cx="320" cy="280" r="6"/><circle cx="380" cy="215" r="6"/>
    <circle cx="420" cy="215" r="6"/><circle cx="480" cy="280" r="6"/><circle cx="550" cy="410" r="6"/>
  </g>
  <!-- Base Rubber Feet -->
  <rect x="210" y="440" width="70" height="15" rx="4" fill="#334155"/>
  <rect x="520" y="440" width="70" height="15" rx="4" fill="#334155"/>

  </g>

  <!-- Clean Top-Right Badge -->
  <g transform="translate(620, 36)">
    <rect width="144" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.9" stroke="#E2E8F0" stroke-width="1"/>
    <text x="72" y="18" fill="#78350F" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5" text-anchor="middle">BEAUTECH AESTHETIC</text>
  </g>

  <!-- Clean Bottom Left Model Label -->
  <g transform="translate(36, 546)">
    <text x="0" y="0" fill="#1C1917" font-family="Georgia, serif" font-size="16" font-weight="600">PDT Omega Light</text>
    <text x="0" y="18" fill="#78716C" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">FACIAL &amp; SKIN CARE</text>
  </g>
</svg>
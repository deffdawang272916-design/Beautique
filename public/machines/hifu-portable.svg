<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="50%" stop-color="#F7F3EB"/>
      <stop offset="100%" stop-color="#EFE9DD"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#1C1917" flood-opacity="0.10"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Clean Studio Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="24"/>

  <!-- Subtle Studio Floor Reflection Oval -->
  <ellipse cx="400" cy="520" rx="260" ry="24" fill="#000000" fill-opacity="0.06"/>
  <ellipse cx="400" cy="516" rx="190" ry="14" fill="#000000" fill-opacity="0.08"/>

  <!-- Machine Hardware Art -->
  <g filter="url(#dropShadow)">
    
  <!-- Desktop Compact Console Box -->
  <rect x="280" y="240" width="240" height="230" rx="22" fill="url(#bodyGrad)" stroke="#CBD5E1" stroke-width="3"/>
  <!-- Angled Touchscreen -->
  <rect x="305" y="260" width="190" height="120" rx="12" fill="url(#screenGrad)"/>
  <rect x="315" y="270" width="170" height="100" rx="8" fill="#1E3A8A" fill-opacity="0.3"/>
  <circle cx="400" cy="315" r="22" fill="none" stroke="#60A5FA" stroke-width="3"/>
  <text x="400" y="320" fill="#DBEAFE" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">HIFU 3.0mm</text>
  <!-- Handle Cable &amp; Handpiece -->
  <path d="M500 420 Q570 420 570 340 L570 240" stroke="#475569" stroke-width="6" fill="none"/>
  <!-- Ergonomic HIFU Transducer Wand -->
  <rect x="550" y="160" width="40" height="130" rx="12" fill="url(#metalGrad)" stroke="#334155" stroke-width="2"/>
  <rect x="555" y="130" width="30" height="35" rx="6" fill="#2563EB"/>
  <text x="570" y="152" fill="#FFFFFF" font-size="8" font-family="sans-serif" font-weight="bold" text-anchor="middle">4.5mm</text>
  <!-- Cartridge Slots on Console Side -->
  <rect x="315" y="405" width="45" height="45" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="337" y="432" fill="#475569" font-size="10" font-weight="bold" text-anchor="middle">1.5</text>
  <rect x="375" y="405" width="45" height="45" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="397" y="432" fill="#475569" font-size="10" font-weight="bold" text-anchor="middle">3.0</text>
  <rect x="435" y="405" width="45" height="45" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="457" y="432" fill="#475569" font-size="10" font-weight="bold" text-anchor="middle">4.5</text>

  </g>

  <!-- Clean Top-Right Badge -->
  <g transform="translate(620, 36)">
    <rect width="144" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.9" stroke="#E2E8F0" stroke-width="1"/>
    <text x="72" y="18" fill="#78350F" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5" text-anchor="middle">BEAUTECH AESTHETIC</text>
  </g>

  <!-- Clean Bottom Left Model Label -->
  <g transform="translate(36, 546)">
    <text x="0" y="0" fill="#1C1917" font-family="Georgia, serif" font-size="16" font-weight="600">HIFU Portable</text>
    <text x="0" y="18" fill="#78716C" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">HIFU / LIFTING / SKIN TIGHTENING</text>
  </g>
</svg>
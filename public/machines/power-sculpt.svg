<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="50%" stop-color="#F7F3EB"/>
      <stop offset="100%" stop-color="#EFE9DD"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#1C1917" flood-opacity="0.10"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Clean Studio Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="24"/>

  <!-- Subtle Studio Floor Reflection Oval -->
  <ellipse cx="400" cy="520" rx="260" ry="24" fill="#000000" fill-opacity="0.06"/>
  <ellipse cx="400" cy="516" rx="190" ry="14" fill="#000000" fill-opacity="0.08"/>

  <!-- Machine Hardware Art -->
  <g filter="url(#dropShadow)">
    
  <!-- Sturdy HI-EMT Body Console -->
  <rect x="300" y="150" width="200" height="340" rx="28" fill="url(#bodyGrad)" stroke="#CBD5E1" stroke-width="3"/>
  <!-- Vivid Capacitive Screen -->
  <rect x="325" y="175" width="150" height="110" rx="12" fill="url(#screenGrad)"/>
  <rect x="335" y="185" width="130" height="90" rx="8" fill="#4F46E5" fill-opacity="0.25"/>
  <circle cx="400" cy="225" r="20" fill="none" stroke="#818CF8" stroke-width="3"/>
  <text x="400" y="229" fill="#EEF2FF" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">EMS POWER</text>
  <text x="400" y="255" fill="#C7D2FE" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">100% INTENSITY</text>
  <!-- Dual Large Muscle Stimulation Paddles -->
  <!-- Left Paddle -->
  <path d="M220 250 Q260 380 325 430" stroke="#4F46E5" stroke-width="10" fill="none"/>
  <rect x="180" y="180" width="70" height="110" rx="20" fill="url(#metalGrad)" stroke="#4F46E5" stroke-width="3"/>
  <circle cx="215" cy="235" r="22" fill="#4F46E5" fill-opacity="0.2"/>
  <!-- Right Paddle -->
  <path d="M580 250 Q540 380 475 430" stroke="#4F46E5" stroke-width="10" fill="none"/>
  <rect x="550" y="180" width="70" height="110" rx="20" fill="url(#metalGrad)" stroke="#4F46E5" stroke-width="3"/>
  <circle cx="585" cy="235" r="22" fill="#4F46E5" fill-opacity="0.2"/>
  <!-- Base Stand -->
  <rect x="280" y="480" width="240" height="26" rx="8" fill="url(#metalGrad)" stroke="#64748B" stroke-width="2"/>
  <circle cx="315" cy="510" r="10" fill="#334155"/><circle cx="485" cy="510" r="10" fill="#334155"/>

  </g>

  <!-- Clean Top-Right Badge -->
  <g transform="translate(620, 36)">
    <rect width="144" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.9" stroke="#E2E8F0" stroke-width="1"/>
    <text x="72" y="18" fill="#78350F" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5" text-anchor="middle">BEAUTECH AESTHETIC</text>
  </g>

  <!-- Clean Bottom Left Model Label -->
  <g transform="translate(36, 546)">
    <text x="0" y="0" fill="#1C1917" font-family="Georgia, serif" font-size="16" font-weight="600">Power Sculpt</text>
    <text x="0" y="18" fill="#78716C" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">BODY CONTOURING</text>
  </g>
</svg>
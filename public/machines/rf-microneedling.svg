<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="50%" stop-color="#F7F3EB"/>
      <stop offset="100%" stop-color="#EFE9DD"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#1C1917" flood-opacity="0.10"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Clean Studio Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="24"/>

  <!-- Subtle Studio Floor Reflection Oval -->
  <ellipse cx="400" cy="520" rx="260" ry="24" fill="#000000" fill-opacity="0.06"/>
  <ellipse cx="400" cy="516" rx="190" ry="14" fill="#000000" fill-opacity="0.08"/>

  <!-- Machine Hardware Art -->
  <g filter="url(#dropShadow)">
    
  <!-- Elegant Vertical Console -->
  <rect x="310" y="150" width="180" height="340" rx="26" fill="url(#bodyGrad)" stroke="#CBD5E1" stroke-width="3"/>
  <rect x="330" y="175" width="140" height="110" rx="12" fill="url(#screenGrad)"/>
  <rect x="340" y="185" width="120" height="90" rx="8" fill="#B45309" fill-opacity="0.2"/>
  <text x="400" y="225" fill="#FDE68A" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">RF MICRONEEDLE</text>
  <text x="400" y="245" fill="#FFFFFF" font-size="9" font-family="sans-serif" text-anchor="middle">DEPTH: 1.50 mm</text>
  <!-- Gold Accent Ring -->
  <circle cx="400" cy="335" r="28" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <!-- Gold Micro-Needle Robotic Wand -->
  <path d="M520 220 Q560 340 480 420" stroke="#475569" stroke-width="6" fill="none"/>
  <rect x="520" y="160" width="36" height="135" rx="10" fill="url(#metalGrad)" stroke="#475569" stroke-width="2"/>
  <!-- Gold Cartridge Tip with Pins -->
  <rect x="526" y="130" width="24" height="32" rx="4" fill="url(#goldGrad)"/>
  <line x1="532" y1="120" x2="532" y2="130" stroke="#D97706" stroke-width="1.5"/>
  <line x1="538" y1="120" x2="538" y2="130" stroke="#D97706" stroke-width="1.5"/>
  <line x1="544" y1="120" x2="544" y2="130" stroke="#D97706" stroke-width="1.5"/>
  <!-- Base Stand -->
  <rect x="290" y="480" width="220" height="24" rx="8" fill="url(#metalGrad)" stroke="#64748B" stroke-width="2"/>
  <circle cx="320" cy="510" r="9" fill="#334155"/><circle cx="480" cy="510" r="9" fill="#334155"/>

  </g>

  <!-- Clean Top-Right Badge -->
  <g transform="translate(620, 36)">
    <rect width="144" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.9" stroke="#E2E8F0" stroke-width="1"/>
    <text x="72" y="18" fill="#78350F" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5" text-anchor="middle">BEAUTECH AESTHETIC</text>
  </g>

  <!-- Clean Bottom Left Model Label -->
  <g transform="translate(36, 546)">
    <text x="0" y="0" fill="#1C1917" font-family="Georgia, serif" font-size="16" font-weight="600">RF Microneedling</text>
    <text x="0" y="18" fill="#78716C" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">HIFU / LIFTING / SKIN TIGHTENING</text>
  </g>
</svg>
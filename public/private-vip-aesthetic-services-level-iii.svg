<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Dark Luxury Slate / Charcoal) -->
    <linearGradient id="vipBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141214"/>
      <stop offset="40%" stop-color="#1E1922"/>
      <stop offset="80%" stop-color="#131015"/>
      <stop offset="100%" stop-color="#0A080B"/>
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="vipGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="25%" stop-color="#FFF0BE"/>
      <stop offset="55%" stop-color="#DFB84E"/>
      <stop offset="100%" stop-color="#AA8222"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="vipCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#28222E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#18131C" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="vipGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#D4AF37" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Poster -->
  <rect width="800" height="1000" fill="url(#vipBgGrad)"/>

  <!-- Subtle Decorative Gold Borders -->
  <rect x="25" y="25" width="750" height="950" rx="16" fill="none" stroke="url(#vipGoldGrad)" stroke-width="2" opacity="0.6"/>
  <rect x="35" y="35" width="730" height="930" rx="12" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.3"/>

  <!-- Corner Ornaments -->
  <g stroke="url(#vipGoldGrad)" stroke-width="2" fill="none" opacity="0.8">
    <path d="M 45 65 L 45 45 L 65 45"/>
    <path d="M 755 65 L 755 45 L 735 45"/>
    <path d="M 45 935 L 45 955 L 65 955"/>
    <path d="M 755 935 L 755 955 L 735 955"/>
  </g>

  <!-- Top VIP Ribbon -->
  <g transform="translate(400, 75)">
    <rect x="-180" y="-14" width="360" height="28" rx="14" fill="#282030" stroke="url(#vipGoldGrad)" stroke-width="1.2"/>
    <text y="5" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#FFF0BE" text-anchor="middle" letter-spacing="3">PRIVATE · EXCLUSIVE · HANDS-ON</text>
  </g>

  <!-- Academy Branding Header -->
  <g transform="translate(400, 135)">
    <text font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-weight="700" font-size="13" fill="#E8D29F" text-anchor="middle" letter-spacing="3">BEAUTIQUE AESTHETIC TRAINING CENTER</text>
    <text y="18" font-family="'Inter', sans-serif" font-weight="500" font-size="10" fill="#9CA3AF" text-anchor="middle" letter-spacing="2">SANTA ROSA, NUEVA ECIJA</text>
  </g>

  <!-- Main Banner Title -->
  <g transform="translate(400, 215)">
    <text font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-weight="800" font-size="34" fill="url(#vipGoldGrad)" text-anchor="middle" letter-spacing="3" filter="url(#vipGlow)">PRIVATE VIP TRAINING</text>
    
    <!-- Level III Subheader -->
    <rect x="-220" y="20" width="440" height="38" rx="19" fill="#231B2A" stroke="url(#vipGoldGrad)" stroke-width="1.5"/>
    <text y="45" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-weight="700" font-size="17" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">AESTHETIC SERVICES LEVEL III</text>
    
    <text y="92" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-size="21" fill="#FFF0BE" text-anchor="middle" letter-spacing="2">Learn · Practice · Elevate</text>
  </g>

  <!-- Training Coverage Container Card -->
  <rect x="70" y="345" width="660" height="490" rx="16" fill="url(#vipCardGrad)" stroke="url(#vipGoldGrad)" stroke-width="1.5"/>

  <!-- Card Header Pill -->
  <g transform="translate(400, 345)">
    <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#1E1724" stroke="url(#vipGoldGrad)" stroke-width="1.5"/>
    <text y="5" font-family="'Inter', sans-serif" font-weight="700" font-size="11.5" fill="#FFF0BE" text-anchor="middle" letter-spacing="2">TRAINING COVERAGE</text>
  </g>

  <!-- Coverage Checklist (9 Verified Points from supplied poster) -->
  <g transform="translate(100, 395)" font-family="'Inter', sans-serif" font-size="14.5" fill="#FFFFFF">
    
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <circle cx="14" cy="14" r="11" fill="#D4AF37" opacity="0.25"/>
      <path d="M 9,14 L 13,18 L 19,10" fill="none" stroke="url(#vipGoldGrad)" stroke-width="2.5" stroke-linecap="round"/>
      <text x="38" y="19" font-weight="600">Advanced Facial Treatment</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(0, 44)">
      <circle cx="14" cy="14" r="11" fill="#D4AF37" opacity="0.25"/>
      <path d="M 9,14 L 13,18 L 19,10" fill="none" stroke="url(#vipGoldGrad)" stroke-width="2.5" stroke-linecap="round"/>
      <text x="38" y="19" font-weight="600">Chemical Skin Peeling</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(0, 88)">
      <circle cx="14" cy="14" r="11" fill="#D4AF37" opacity="0.25"/>
      <path d="M 9,14 L 13,18 L 19,10" fill="none" stroke="url(#vipGoldGrad)" stroke-width="2.5" stroke-linecap="round"/>
      <text x="38" y="19" font-weight="600">Light Therapy</text>
    </g>

    <!-- Item 4 -->
    <g transform="translate(0, 132)">
      <circle cx="14" cy="14" r="11" fill="#D4AF37" opacity="0.25"/>
      <path d="M 9,14 L 13,18 L 19,10" fill="none" stroke="url(#vipGoldGrad)" stroke-width="2.5" stroke-linecap="round"/>
      <text x="38" y="19" font-weight="600">Heat Therapy</text>
    </g>

    <!-- Item 5 -->
    <g transform="translate(0, 176)">
      <circle cx="14" cy="14" r="11" fill="#D4AF37" opacity="0.25"/>
      <path d="M 9,14 L 13,18 L 19,10" fill="none" stroke="url(#vipGoldGrad)" stroke-width="2.5" stroke-linecap="round"/>
      <text x="38" y="19" font-weight="600">Client Consultation &amp; Assessment</text>
    </g>

    <!-- Item 6 -->
    <g transform="translate(0, 220)">
      <circle cx="14" cy="14" r="11" fill="#D4AF37" opacity="0.25"/>
      <path d="M 9,14 L 13,18 L 19,10" fill="none" stroke="url(#vipGoldGrad)" stroke-width="2.5" stroke-linecap="round"/>
      <text x="38" y="19" font-weight="600">Client Safety, Contraindications &amp; Treatment Requirements</text>
    </g>

    <!-- Item 7 -->
    <g transform="translate(0, 264)">
      <circle cx="14" cy="14" r="11" fill="#D4AF37" opacity="0.25"/>
      <path d="M 9,14 L 13,18 L 19,10" fill="none" stroke="url(#vipGoldGrad)" stroke-width="2.5" stroke-linecap="round"/>
      <text x="38" y="19" font-weight="600">Quality Standards &amp; Safe Work Practices</text>
    </g>

    <!-- Item 8 -->
    <g transform="translate(0, 308)">
      <circle cx="14" cy="14" r="11" fill="#D4AF37" opacity="0.25"/>
      <path d="M 9,14 L 13,18 L 19,10" fill="none" stroke="url(#vipGoldGrad)" stroke-width="2.5" stroke-linecap="round"/>
      <text x="38" y="19" font-weight="600">Proper Preparation, Procedures &amp; Aftercare</text>
    </g>

    <!-- Item 9 -->
    <g transform="translate(0, 352)">
      <circle cx="14" cy="14" r="11" fill="#D4AF37" opacity="0.25"/>
      <path d="M 9,14 L 13,18 L 19,10" fill="none" stroke="url(#vipGoldGrad)" stroke-width="2.5" stroke-linecap="round"/>
      <text x="38" y="19" font-weight="700" fill="#FFF0BE">Hands-On Practical Training</text>
    </g>

  </g>

  <!-- Bottom Notice Card -->
  <g transform="translate(70, 855)">
    <rect x="0" y="0" width="660" height="90" rx="12" fill="#1C1622" stroke="url(#vipGoldGrad)" stroke-width="1.2"/>
    <text x="330" y="36" font-family="'Cinzel', 'Playfair Display', serif" font-weight="700" font-size="16" fill="url(#vipGoldGrad)" text-anchor="middle" letter-spacing="1.5">LIMITED VIP SLOTS AVAILABLE</text>
    <text x="330" y="64" font-family="'Inter', sans-serif" font-weight="500" font-size="13" fill="#FFFFFF" text-anchor="middle">Message Us Now for Training Details &amp; Registration</text>
  </g>
</svg>
